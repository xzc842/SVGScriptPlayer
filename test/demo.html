<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SVG Script Player · Demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0b1120;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px;
  }

  header {
    width: 100%;
    max-width: 960px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  header h1 {
    font-size: 1.25rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  header h1 span {
    color: #818cf8;
    font-size: 0.85rem;
    margin-left: 8px;
    font-weight: 500;
  }

  .stage-wrap {
    width: 100%;
    max-width: 960px;
    background: #111827;
    border-radius: 20px;
    padding: 12px;
    box-shadow: 0 20px 50px -20px rgba(0, 0, 0, 0.6);
  }

  #stage {
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 2;
    background: #0f172a;
    border-radius: 12px;
    overflow: hidden;
  }

  #stage svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  .svg-script-slot-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .svg-script-slot {
    pointer-events: auto;
  }

  .controls {
    width: 100%;
    max-width: 960px;
    margin-top: 16px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
  }

  button {
    background: #1e293b;
    color: #e2e8f0;
    border: 1px solid #334155;
    border-radius: 999px;
    padding: 8px 18px;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }

  button:hover:not(:disabled) {
    background: #273449;
    border-color: #475569;
  }

  button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  button.primary {
    background: #4f46e5;
    border-color: #4f46e5;
    color: #fff;
  }

  button.primary:hover:not(:disabled) {
    background: #4338ca;
    border-color: #4338ca;
  }

  .speed {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
    font-size: 0.85rem;
    color: #94a3b8;
  }

  .speed input {
    width: 100px;
    accent-color: #818cf8;
  }

  .status {
    width: 100%;
    max-width: 960px;
    margin-top: 12px;
    font-size: 0.8rem;
    color: #64748b;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }

  .status b {
    color: #94a3b8;
    font-weight: 600;
  }

  .error {
    color: #f87171;
  }
</style>
</head>
<body>

<header>
  <h1>SVG Script Player <span>demo</span></h1>
</header>

<div class="stage-wrap">
  <div id="stage"></div>
</div>

<div class="controls">
  <button id="playBtn" class="primary" disabled>▶ 播放</button>
  <button id="pauseBtn" disabled>⏸ 暂停</button>
  <button id="resetBtn" disabled>↺ 重置</button>
  <button id="startBtn" disabled>⏮ start</button>
  <button id="ballsBtn" disabled>⏭ balls</button>
  <button id="endBtn" disabled>⏭ end</button>

  <div class="speed">
    <label for="speed">速度</label>
    <input id="speed" type="range" min="0.25" max="2" step="0.25" value="1" />
    <span id="speedVal">1x</span>
  </div>
</div>

<div class="status">
  <span>状态: <b id="statusText">加载中…</b></span>
  <span>时间: <b id="timeText">0 / 0 ms</b></span>
  <span>进度: <b id="progressText">0%</b></span>
</div>

<!-- ============================================
     加载播放器
     方式 1：从 src 直接加载（开发用，需 http 服务）
     方式 2：打包后从 dist 加载
     ============================================ -->

<script type="module">
  import {SVGScriptPlayer} from "../src/browser/index.js";

  // ---------- DOM ----------
  const $ = (id) => document.getElementById(id);
  const playBtn = $("playBtn");
  const pauseBtn = $("pauseBtn");
  const resetBtn = $("resetBtn");
  const startBtn = $("startBtn");
  const ballsBtn = $("ballsBtn");
  const endBtn = $("endBtn");
  const speedInput = $("speed");
  const speedVal = $("speedVal");
  const statusText = $("statusText");
  const timeText = $("timeText");
  const progressText = $("progressText");

  // ---------- 初始化 ----------
  let player;

  try {
    player = new SVGScriptPlayer({
      container: "#stage",
      basePath: "", 
      speed: 1.0,
    });

    // 从文件加载脚本
    await player.loadFile("demo.txt");

    // 启用按钮
    playBtn.disabled = false;
    pauseBtn.disabled = true;
    resetBtn.disabled = false;
    startBtn.disabled = false;
    ballsBtn.disabled = false;
    endBtn.disabled = false;

    statusText.textContent = "就绪";
    statusText.className = "";

    updateTime(0, player.getDuration());
  } catch (err) {
    console.error(err);
    statusText.textContent = "加载失败: " + err.message;
    statusText.className = "error";
  }

  // ---------- 控制按钮 ----------
  playBtn.onclick = () => player.play();
  pauseBtn.onclick = () => player.pause();

  resetBtn.onclick = () => {
    player.reset();
    statusText.textContent = "已重置";
  };

  startBtn.onclick = () => {
    player.seekTag("start");
    statusText.textContent = "跳到 start";
  };

  ballsBtn.onclick = () => {
    player.seekTag("balls");
    statusText.textContent = "跳到 balls";
  };

  endBtn.onclick = () => {
    player.seekTag("end");
    statusText.textContent = "跳到 end";
  };

  speedInput.oninput = (e) => {
    const v = parseFloat(e.target.value);
    player.setSpeed(v);
    speedVal.textContent = v + "x";
  };

  // ---------- 播放器事件 ----------
  player.on("play", () => {
    playBtn.disabled = true;
    pauseBtn.disabled = false;
    statusText.textContent = "播放中";
    statusText.className = "";
  });

  player.on("pause", () => {
    playBtn.disabled = false;
    pauseBtn.disabled = true;
    statusText.textContent = "已暂停";
  });

  player.on("complete", () => {
    playBtn.disabled = false;
    pauseBtn.disabled = true;
    statusText.textContent = "播放结束";
  });

  player.on("timeupdate", (time, progress) => {
    updateTime(time, player.getDuration());
    progressText.textContent = Math.round(progress * 100) + "%";
  });

  player.on("seek", (time) => {
    updateTime(time, player.getDuration());
  });

  player.on("tag", (name) => {
    console.log("[tag]", name);
  });

  // ---------- 工具 ----------
  function updateTime(ms, total) {
    timeText.textContent = `${Math.round(ms)} / ${Math.round(total)} ms`;
  }

  // 方便调试
  window.player = player;
</script>

</body>
</html>
