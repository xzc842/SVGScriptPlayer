<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SVG Script Player · Examples</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0b1120;
    color: #e2e8f0;
    min-height: 100vh;
    padding: 40px 24px;
  }

  .container {
    max-width: 800px;
    margin: 0 auto;
  }

  h1 {
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
  }

  .subtitle {
    color: #64748b;
    font-size: 0.95rem;
    margin-bottom: 40px;
  }

  .list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .item {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 20px 24px;
    background: #111827;
    border: 1px solid #1e293b;
    border-radius: 14px;
    text-decoration: none;
    color: inherit;
    transition: all 0.15s;
  }

  .item:hover {
    background: #1a2234;
    border-color: #334155;
    transform: translateY(-1px);
  }

  .item-icon {
    font-size: 1.8rem;
    flex-shrink: 0;
  }

  .item-body {
    flex: 1;
  }

  .item-title {
    font-size: 1.05rem;
    font-weight: 600;
    margin-bottom: 4px;
  }

  .item-desc {
    font-size: 0.85rem;
    color: #64748b;
  }

  .item-arrow {
    color: #475569;
    font-size: 1.2rem;
  }
</style>
</head>
<body>

<div class="container">
  <h1>SVG Script Player</h1>
  <p class="subtitle">示例与演示</p>

  <div class="list">
    <a class="item" href="demo.html">
      <div class="item-icon">🎬</div>
      <div class="item-body">
        <div class="item-title">基础演示</div>
        <div class="item-desc">三个圆弹跳 · 两段对话 · 卡片弹出</div>
      </div>
      <div class="item-arrow">→</div>
    </a>

    <a class="item" href="demo2.html">
      <div class="item-icon">📊</div>
      <div class="item-body">
        <div class="item-title">进阶演示</div>
        <div class="item-desc">柱状图 · 圆周旋转 · 多场景编排</div>
      </div>
      <div class="item-arrow">→</div>
    </a>

    <a class="item" href="interactive.html">
      <div class="item-icon">🖱</div>
      <div class="item-body">
        <div class="item-title">交互演示</div>
        <div class="item-desc">div 插槽 · 按钮点击 · 事件回调</div>
      </div>
      <div class="item-arrow">→</div>
    </a>
  </div>
</div>

</body>
</html>
